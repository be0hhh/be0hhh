<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Signal to system</title>
  <desc id="desc">A static dark technical diagram connecting signal, structure, and decision.</desc>

  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55D6BE"/>
      <stop offset="0.58" stop-color="#63B3ED"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#D7E2EA" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="url(#grid)" stroke="#263441" stroke-width="2"/>

  <path d="M 118 164 C 248 88, 314 230, 442 148 S 674 82, 790 158 S 1010 228, 1080 116" fill="none" stroke="#172630" stroke-width="14"/>
  <path d="M 118 164 C 248 88, 314 230, 442 148 S 674 82, 790 158 S 1010 228, 1080 116" fill="none" stroke="url(#route)" stroke-width="3"/>

  <g fill="#0B0F14" stroke="#55D6BE" stroke-width="3">
    <circle cx="118" cy="164" r="10"/>
    <circle cx="442" cy="148" r="10"/>
  </g>
  <g fill="#0B0F14" stroke="#63B3ED" stroke-width="3">
    <circle cx="790" cy="158" r="10"/>
  </g>
  <g fill="#0B0F14" stroke="#FFB454" stroke-width="3">
    <circle cx="1080" cy="116" r="10"/>
  </g>

  <g fill="#D7E2EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">
    <text x="88" y="224">SIGNAL</text>
    <text x="398" y="108">STRUCTURE</text>
    <text x="750" y="214">BOUNDARY</text>
    <text x="1032" y="82">DECISION</text>
  </g>

  <g fill="#55D6BE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <text x="88" y="246">market data</text>
  </g>
  <g fill="#63B3ED" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <text x="398" y="130">C++ / low latency</text>
  </g>
  <g fill="#FFB454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <text x="1032" y="104">trading systems</text>
  </g>
</svg>
